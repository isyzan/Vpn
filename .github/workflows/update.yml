name: ISYZAN VPN Auto-Update

on:
  schedule:
    - cron: '0 */2 * * *'   # каждые 2 часа
  workflow_dispatch:         # ручной запуск

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Run filter
        run: python filter.py

      - name: Upload config (артефакт)
        uses: actions/upload-artifact@v4
        with:
          name: isyzan-vpn-config
          path: isyzan_vpn.txt

      - name: Commit and push if changed
        run: |
          git config user.name "ISYZAN Bot"
          git config user.email "bot@isyzan.local"
          git add isyzan_vpn.txt
          git diff --staged --quiet || git commit -m "Auto-update ISYZAN VPN $(date +'%Y-%m-%d %H:%M')"
          git push
